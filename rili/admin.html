<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>لوحة تحكم Rili</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--line:rgba(190,175,255,.22);--text:#f4f1ff;--mut:#b9b3e6;--acc:#6fcfff;--ok:#4fe08a;--bad:#ff7b8a;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{color:var(--text);font-family:"Cairo",system-ui,sans-serif;font-size:16px;line-height:1.6;min-height:100vh;
  background:
    radial-gradient(1px 1px at 12% 18%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 72% 8%,#fff 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 40% 62%,#cfe6ff 50%,transparent 51%),radial-gradient(1px 1px at 88% 44%,#fff 50%,transparent 51%),
    radial-gradient(1px 1px at 22% 82%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 60% 30%,#fff 50%,transparent 51%),
    radial-gradient(900px 500px at 85% -10%,rgba(120,110,255,.35),transparent 60%),
    radial-gradient(700px 500px at 0% 100%,rgba(60,140,255,.18),transparent 60%),
    linear-gradient(180deg,#110d3d,#1e1866 60%,#2a2190) fixed;
  background-attachment:fixed}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 130px}
header{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0;margin-bottom:6px;
  background:linear-gradient(180deg,rgba(17,13,61,.96),rgba(17,13,61,.8));backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:10px}
.brand .dot{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#fff 0 18%,#cfe6ff 30%,#8f8bff 60%,transparent 72%);box-shadow:0 0 18px 4px rgba(150,200,255,.5)}
.brand b{display:block;font-size:20px;line-height:1.1;direction:ltr;text-align:right}
.brand small{color:var(--mut);font-size:13px}
#who{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mut)}
#who .av{width:30px;height:30px;border-radius:50%;background:#2f55c8;display:grid;place-items:center;color:#fff;font-weight:800}
.card{background:rgba(32,25,110,.62);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;backdrop-filter:blur(10px);box-shadow:0 18px 40px -24px rgba(5,3,30,.9)}
h3{font-size:18px;margin:22px 0 10px}
.btn{font:inherit;font-weight:700;border-radius:999px;padding:10px 18px;cursor:pointer;color:#fff;background:rgba(255,255,255,.08);border:1px solid var(--line);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:.2s;white-space:nowrap}
.btn:hover{border-color:var(--acc)}
.btn.main{background:linear-gradient(135deg,#3fa2f2,#8b7bff);border:0;box-shadow:0 8px 24px -8px rgba(80,160,255,.7)}
.btn.sm{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.hide{display:none!important}
.login{max-width:440px;margin:12vh auto 0;text-align:center;padding:30px 24px}
.login .planet{width:90px;height:90px;margin:0 auto 14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9fe4ff,#2f8cf0 60%,#173c9c);box-shadow:0 0 40px 6px rgba(80,160,255,.4)}
.login h2{margin:0 0 6px;font-size:22px}
.login p{color:var(--mut);margin:0 0 18px;font-size:15px}
.tabs{position:sticky;top:64px;z-index:15;display:flex;gap:6px;overflow-x:auto;padding:6px;margin:0 0 14px;border-radius:999px;background:rgba(17,13,61,.85);border:1px solid var(--line);backdrop-filter:blur(10px);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;font:inherit;font-weight:700;font-size:14px;color:var(--mut);background:transparent;border:0;border-radius:999px;padding:8px 14px;cursor:pointer}
.tab.on{color:#0f1745;background:linear-gradient(135deg,#d6ecff,#b9c6ff)}
.help{color:var(--mut);font-size:14px;margin:0 0 14px;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px dashed var(--line)}
.item{background:rgba(20,15,75,.6);border:1px solid var(--line);border-radius:18px;margin-bottom:10px;overflow:hidden;transition:border-color .2s}
.item.open{border-color:rgba(111,207,255,.55)}
.item-h{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer}
.item-h .ti{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.item-h .ti img,.item-h .ti .noimg{width:72px;height:40px;border-radius:8px;object-fit:cover;flex:none;background:linear-gradient(135deg,#2a1f86,#5c3fc4);display:grid;place-items:center;font-size:18px}
.item-h .ti .txt{min-width:0}
.item-h .ti b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-h .ti small{color:var(--mut);font-size:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cbadge{display:inline-flex;align-items:center;gap:4px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:700;color:#0f1745;background:var(--cc,#cfe6ff)}
.cbadge.none{background:var(--bad);color:#fff}
.item-h .tools{display:flex;gap:4px;flex:none}
.item-h .tools button{font:inherit;width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);cursor:pointer}
.item-b{padding:6px 14px 16px;border-top:1px solid var(--line)}
.item:not(.open) .item-b{display:none}
.f{display:flex;flex-direction:column;gap:5px;margin-top:12px}
.f label{font-weight:700;font-size:14px}
.f small{color:var(--mut);font-weight:400}
.f input,.f textarea,.f select{font:inherit;font-size:15px;color:var(--text);background:rgba(8,5,40,.6);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;outline:none}
.f textarea{min-height:92px;resize:vertical}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(111,207,255,.15)}
.f select option{background:#241c78}
.f .ltr{direction:ltr;text-align:left}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cat{font:inherit;font-size:14px;font-weight:700;color:#fff;cursor:pointer;padding:8px 14px;border-radius:999px;
  background:color-mix(in srgb,var(--cc) 18%,rgba(10,6,45,.8));border:1.5px solid color-mix(in srgb,var(--cc) 55%,transparent)}
.cat.on{background:var(--cc);color:#0f1745;box-shadow:0 0 16px -2px var(--cc)}
.f.need .cats{outline:2px dashed var(--bad);outline-offset:6px;border-radius:12px}
.pdfrow{display:flex;gap:8px;margin-top:6px}
.pdfbox{padding:12px;border-radius:14px;background:rgba(255,224,138,.06);border:1px dashed rgba(255,224,138,.45)}
.upl{width:100%;padding:12px;cursor:pointer}
.pmsg{margin:6px 0 0;font-size:13px;color:var(--mut);min-height:1em}
.pdfdone{display:flex;align-items:center;gap:8px}
.pdfdone .ic{font-size:22px}
.pdfdone .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.btn.del{color:#ffb3bc;border-color:rgba(255,107,125,.5)}
.pdfrow input{flex:1}
details.how{font-size:13px;color:var(--mut);margin-top:4px}
details.how summary{cursor:pointer;color:var(--acc)}
details.how ol{margin:6px 0 0;padding-right:18px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.row2{grid-template-columns:1fr}}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-weight:700;font-size:14px}
.thumb{margin-top:8px;max-width:240px;border-radius:10px;border:1px solid var(--line)}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(17,13,61,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.savebar .in{max-width:900px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
#status{font-size:14px;color:var(--mut)}
@media (max-width:480px){.savebar .btn{padding:8px 12px;font-size:14px}#status{font-size:12px}}
.add{width:100%;margin-bottom:12px;padding:14px;font-size:16px;border:1.5px dashed rgba(111,207,255,.6);background:rgba(111,207,255,.08)}
.err{color:var(--bad);font-size:14px}
.req.unread{border-color:rgba(111,207,255,.7);background:rgba(40,80,170,.35)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="dot"></span><span><b>Rili's World</b><small>لوحة التحكم</small></span></div>
    <div id="who"></div>
  </header>

  <div class="card login" id="loginCard">
    <div class="planet"></div>
    <h2>لوحة تحكم Rili's World</h2>
    <p>سجّل الدخول بحسابك في Google لتعديل محتوى الموقع.</p>
    <button class="btn main" id="loginBtn">تسجيل الدخول بحساب Google</button>
    <p class="err" id="loginErr"></p>
  </div>

  <div id="app" class="hide">
    <nav class="tabs" id="tabs"></nav>
    <div id="panel"></div>
  </div>
</div>
<div class="savebar hide" id="saveBar"><div class="in"><span id="status">لا توجد تغييرات</span><span style="display:flex;gap:8px"><a class="btn sm" href="index.html" target="_blank">عرض الموقع</a><button class="btn main" id="saveBtn">حفظ ونشر</button></span></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* إعدادات Firebase — نفس المشروع المستخدم في الموقع */
const FB = { apiKey:"AIzaSyCITou77DcRQUct-JdyyF-5MH_27sETi1A", authDomain:"rili-s-world-6b67e.firebaseapp.com", projectId:"rili-s-world-6b67e", appId:"1:924631439177:web:abb1d4bdf5318876ee6c98" };
const DOC = ["rili_site","content"];

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SITE_KEYS=["tagline","aboutRole","about","stats","socials","support","categories","facts","factEvery","astroGreeting","astroJokes","ideas","formEndpoint","requestEmail"];
let C={site:{},videos:[],quiz:[]}, db=null, auth=null, dirty=false, tab="videos";

function setDirty(v=true){ dirty=v; $("#status").innerHTML=v?'<span class="bad">● تغييرات غير محفوظة</span>':'<span class="ok">✓ كل شيء محفوظ</span>'; }
addEventListener("beforeunload",e=>{ if(dirty){ e.preventDefault(); e.returnValue=""; } });

/* ---------- defaults: read the data section from index.html ---------- */
async function loadDefaults(){
  try{
    const html=await (await fetch("index.html",{cache:"no-store"})).text();
    const a=html.indexOf("/*DATA-START*/"), b=html.indexOf("/*DATA-END*/");
    if(a<0||b<0) throw 0;
    const d=new Function(html.slice(a,b)+";return {SITE,VIDEOS,QUIZ};")();
    const site={}; SITE_KEYS.forEach(k=>{ if(d.SITE[k]!==undefined) site[k]=d.SITE[k]; });
    return {site,videos:d.VIDEOS||[],quiz:d.QUIZ||[]};
  }catch(e){ return {site:{},videos:[],quiz:[]}; }
}

/* ---------- small form builder ---------- */
const today=()=>new Date().toISOString().slice(0,10);
function ytId(u){ u=String(u||"").trim(); if(!u) return ""; if(/^[\w-]{11}$/.test(u)) return u;
  const m=u.match(/(?:youtu\.be\/|v=|\/shorts\/|\/embed\/|\/live\/)([\w-]{11})/); return m?m[1]:""; }
function field(obj,f){
  const w=document.createElement("div"); w.className="f";
  const lab=`<label>${esc(f.label)}${f.hint?` <small>${esc(f.hint)}</small>`:""}</label>`;
  let v=obj[f.k];
  if(f.type==="check"){ w.className="chk"; w.innerHTML=`<input type="checkbox" ${v?"checked":""}> ${esc(f.label)}`; w.querySelector("input").onchange=e=>{obj[f.k]=e.target.checked;setDirty()}; return w; }
  if(f.type==="cat"){
    const cats=C.site.categories||[];
    w.innerHTML=lab+`<div class="cats">${cats.map(c=>`<button type="button" class="cat ${c.name===v?"on":""}" data-n="${esc(c.name)}" style="--cc:${esc(c.color||"#cfe6ff")}">${esc((c.icon||"")+" "+c.name)}</button>`).join("")}</div>`;
    w.querySelector(".cats").onclick=e=>{ const b=e.target.closest(".cat"); if(!b) return; obj[f.k]=b.dataset.n;
      w.querySelectorAll(".cat").forEach(x=>x.classList.toggle("on",x===b)); w.classList.remove("need"); setDirty(); f.onchange&&f.onchange(); };
    return w; }
  if(f.type==="pdf"){
    w.classList.add("pdfbox");
    function draw(){
      const v=obj[f.k]||"", isFile=v.startsWith("fs:");
      w.innerHTML=lab+(v
        ? `<div class="pdfdone"><span class="ic">📄</span><span class="nm">${esc(isFile?(obj.pdfName||"ملف PDF"):v)}</span>
             ${isFile?"":`<a class="btn sm" href="${esc(v)}" target="_blank" rel="noopener">فتح</a>`}<button type="button" class="btn sm del">حذف</button></div>`
        : `<label class="btn main upl">⬆ رفع ملف PDF<input type="file" accept="application/pdf" hidden></label>
           <p class="pmsg"></p>
           <details class="how"><summary>أو ضع رابطًا بدل الرفع</summary><div class="pdfrow"><input class="ltr" placeholder="https://drive.google.com/file/d/..."><button type="button" class="btn sm">إضافة</button></div></details>`);
      if(v){ w.querySelector(".del").onclick=async()=>{ if(!confirm("حذف ملف الملخص؟")) return;
          if(isFile) deleteFile(v.slice(3)); obj[f.k]=""; delete obj.pdfName; setDirty(); draw(); f.onchange&&f.onchange(); };
        return; }
      const msg=w.querySelector(".pmsg");
      w.querySelector("input[type=file]").onchange=async e=>{
        const file=e.target.files[0]; if(!file) return;
        if(file.type!=="application/pdf"&&!/\.pdf$/i.test(file.name)){ msg.innerHTML='<span class="bad">اختر ملف PDF فقط</span>'; return; }
        if(file.size>5*1024*1024){ msg.innerHTML='<span class="bad">حجم الملف أكبر من 5 ميغابايت</span>'; return; }
        try{
          const id=await uploadFile(file,(i,n)=>{ msg.textContent=`جارٍ الرفع… ${Math.round(i/n*100)}%`; });
          obj[f.k]="fs:"+id; obj.pdfName=file.name; setDirty(); draw(); f.onchange&&f.onchange();
        }catch(err){ console.warn(err); msg.innerHTML=`<span class="bad">${err&&err.code==="permission-denied"?"لا توجد صلاحية للرفع، أضف قاعدة rili_files في Firestore (راجع الدليل)":"تعذّر رفع الملف، حاول مرة أخرى"}</span>`; }
      };
      const li=w.querySelector(".pdfrow input");
      w.querySelector(".pdfrow button").onclick=()=>{ const u=li.value.trim(); if(!/^https?:\/\//.test(u)) return; obj[f.k]=u; delete obj.pdfName; setDirty(); draw(); f.onchange&&f.onchange(); };
    }
    draw(); return w; }
  if(f.type==="select"){ const opts=typeof f.options==="function"?f.options():f.options;
    w.innerHTML=lab+`<select>${opts.map(o=>`<option ${o===v?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
    w.querySelector("select").onchange=e=>{obj[f.k]=e.target.value;setDirty();f.onchange&&f.onchange()}; return w; }
  let val=v, multi=false;
  if(f.type==="lines"){ val=(v||[]).join("\n"); multi=true; }
  if(f.type==="paras"){ val=(v||[]).join("\n\n"); multi=true; }
  if(f.type==="chapters"){ val=(v||[]).map(c=>c.join(" ")).join("\n"); multi=true; }
  if(f.type==="textarea"){ multi=true; }
  if(f.type==="youtube"){ val=obj.youtubeUrl||(obj.youtubeId?"https://youtu.be/"+obj.youtubeId:""); }
  w.innerHTML=lab+(multi?`<textarea class="${f.ltr?"ltr":""}" placeholder="${esc(f.ph||"")}">${esc(val??"")}</textarea>`
    :`<input class="${f.ltr?"ltr":""}" type="${f.inputType||"text"}" value="${esc(val??"")}" placeholder="${esc(f.ph||"")}">`);
  const inp=w.querySelector("input,textarea");
  inp.oninput=()=>{ const t=inp.value;
    if(f.type==="lines") obj[f.k]=t.split("\n").map(x=>x.trim()).filter(Boolean);
    else if(f.type==="paras") obj[f.k]=t.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
    else if(f.type==="chapters") obj[f.k]=t.split("\n").map(x=>x.trim()).filter(Boolean).map(x=>{const m=x.match(/^(\d{1,2}:\d{2}(?::\d{2})?)\s*[-–—]?\s*(.*)$/);return m?[m[1],m[2]]:["",x]});
    else if(f.type==="youtube"){ obj.youtubeUrl=t.trim(); obj.youtubeId=ytId(t); showThumb(); }
    else if(f.inputType==="number") obj[f.k]=+t;
    else obj[f.k]=t;
    setDirty(); f.onchange&&f.onchange(); };
  function showThumb(){ let im=w.querySelector("img"), st=w.querySelector(".yt-st");
    if(!st){ st=document.createElement("small"); st.className="yt-st"; w.appendChild(st); }
    if(obj.youtubeId){ st.innerHTML='<span class="ok">✓ تم التعرّف على الفيديو</span>'; if(!im){ im=document.createElement("img"); im.className="thumb"; w.appendChild(im); } im.src=`https://i.ytimg.com/vi/${obj.youtubeId}/mqdefault.jpg`; }
    else { st.innerHTML=obj.youtubeUrl?'<span class="bad">الرابط غير صحيح — انسخ رابط الفيديو من يوتيوب</span>':""; if(im) im.remove(); } }
  if(f.type==="youtube") showThumb();
  return w;
}
function listEditor(arr,{fields,title,head,addLabel,make,fixed,open}){
  const box=document.createElement("div");
  function draw(){
    box.innerHTML="";
    if(!fixed){ const add=document.createElement("button"); add.className="btn add"; add.textContent="＋ "+addLabel;
      add.onclick=()=>{ arr.unshift(make()); setDirty(); draw(); box.querySelector(".item").classList.add("open"); }; box.appendChild(add); }
    arr.forEach((it,i)=>{
      const el=document.createElement("div"); el.className="item"+(open?" open":"");
      const headHTML=()=>head?head(it):`<span class="ti"><span class="txt"><b>${esc(title(it,i)||"(بدون عنوان)")}</b></span></span>`;
      el.innerHTML=`<div class="item-h">${headHTML()}<span class="tools">${fixed?"":`<button data-a="up" title="لأعلى">↑</button><button data-a="dn" title="لأسفل">↓</button><button data-a="del" title="حذف">🗑</button>`}</span></div><div class="item-b"></div>`;
      const body=el.querySelector(".item-b");
      const refresh=()=>{ el.querySelector(".item-h .ti").outerHTML=headHTML(); };
      fields.forEach(row=>{ const r=Array.isArray(row)?row:[row]; const g=document.createElement("div"); if(r.length>1) g.className="row2";
        r.forEach(f=>g.appendChild(field(it,{...f,onchange:refresh}))); body.appendChild(g); });
      el.querySelector(".item-h").onclick=e=>{ const a=e.target.dataset&&e.target.dataset.a;
        if(a==="up"&&i>0){ [arr[i-1],arr[i]]=[arr[i],arr[i-1]]; setDirty(); draw(); }
        else if(a==="dn"&&i<arr.length-1){ [arr[i+1],arr[i]]=[arr[i],arr[i+1]]; setDirty(); draw(); }
        else if(a==="del"){ if(confirm("حذف هذا العنصر من الموقع؟")){ const gone=arr.splice(i,1)[0]; if(gone&&String(gone.pdf||"").startsWith("fs:")) deleteFile(gone.pdf.slice(3)); setDirty(); draw(); saveAll(); } }
        else if(!a) el.classList.toggle("open"); };
      box.appendChild(el);
    });
    if(!arr.length&&fixed) box.innerHTML='<p class="help">لا توجد عناصر.</p>';
  }
  draw(); return box;
}
/* ---------- PDF files stored in Firestore (free plan), split into parts ---------- */
const FILES="rili_files", PART=700000;
function fileToB64(file){ return new Promise((ok,bad)=>{ const r=new FileReader(); r.onload=()=>ok(String(r.result).split(",")[1]); r.onerror=bad; r.readAsDataURL(file); }); }
async function uploadFile(file,prog){
  const b64=await fileToB64(file), n=Math.ceil(b64.length/PART), id="f"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  for(let i=0;i<n;i++){ prog(i,n); await db.collection(FILES).doc(id+"_p"+i).set({d:b64.slice(i*PART,(i+1)*PART)}); }
  await db.collection(FILES).doc(id).set({name:file.name,size:file.size,parts:n,type:"application/pdf"}); prog(n,n);
  return id;
}
async function deleteFile(id){ try{ const m=await db.collection(FILES).doc(id).get(); const n=m.exists?m.data().parts:0;
  for(let i=0;i<n;i++) await db.collection(FILES).doc(id+"_p"+i).delete(); await db.collection(FILES).doc(id).delete(); }catch(e){ console.warn(e); } }
const catNames=()=>((C.site.categories||[]).map(c=>c.name)).concat(["أخرى"]);

/* ---------- tabs ---------- */
const TABS={
  videos:{label:"📺 الفيديوهات",render(p){

let INBOX=null;
async function loadInbox(){
  try{
    const snap=await db.collection("rili_requests").orderBy("created","desc").limit(300).get();
    INBOX=snap.docs.map(d=>({id:d.id,...d.data()}));
  }catch(e){ console.warn(e); const box=$("#inboxList");
    if(box) box.innerHTML=`<p class="bad">${e&&e.code==="permission-denied"?"لا توجد صلاحية، أضف قاعدة rili_requests في Firestore (راجع الدليل)":"تعذّر تحميل الاقتراحات"}</p>`; return; }
  renderInbox();
}
function renderInbox(){
  updateBadge(); const box=$("#inboxList"); if(!box||!INBOX) return;
  if(!INBOX.length){ box.innerHTML='<p class="help">لا توجد اقتراحات بعد.</p>'; return; }
  const fmt=t=>{ try{ const d=t&&t.toDate?t.toDate():new Date(t); return d.toLocaleString("ar",{dateStyle:"medium",timeStyle:"short"}) }catch(e){ return "" } };
  const col=n=>(((C.site.categories||[]).find(c=>c.name===n))||{}).color||"#cfe6ff";
  box.innerHTML=INBOX.map(r=>`<div class="item open req ${r.read?"":"unread"}" data-id="${esc(r.id)}">
    <div class="item-h"><span class="ti"><span class="txt"><b>${r.read?"":"🔵 "}${esc(r.title)}</b>
      <small><span>${esc(fmt(r.created))}</span>${r.category?`<span class="cbadge" style="--cc:${esc(col(r.category))}">${esc(r.category)}</span>`:""}</small></span></span>
      <span class="tools">${r.read?"":`<button data-a="read" title="تمّت القراءة">✓</button>`}<button data-a="rdel" title="حذف">🗑</button></span></div>
    <div class="item-b"><p style="white-space:pre-wrap;margin:8px 0">${esc(r.details)}</p>
      <small class="help" style="display:block;margin:0">${esc([r.type,r.platform].filter(Boolean).join(" · "))}${r.name||r.contact?`<br>من: <b>${esc(r.name||"")}</b> ${r.contact?`<span dir="ltr">${esc(r.contact)}</span>`:""}`:""}</small></div></div>`).join("");
  box.onclick=async e=>{ const btn=e.target.closest("button"); if(!btn) return; const id=btn.closest(".req").dataset.id, a=btn.dataset.a;
    try{
      if(a==="read"){ await db.collection("rili_requests").doc(id).update({read:true}); INBOX.find(x=>x.id===id).read=true; }
      else if(a==="rdel"){ if(!confirm("حذف هذا الاقتراح؟")) return; await db.collection("rili_requests").doc(id).delete(); INBOX=INBOX.filter(x=>x.id!==id); }
      renderInbox();
    }catch(err){ console.warn(err); alert("تعذّر تنفيذ العملية"); } };
}
function updateBadge(){ const n=(INBOX||[]).filter(r=>!r.read).length; TABS.inbox.label="📬 الاقتراحات"+(n?` (${n})`:"");
  const t=document.querySelector('.tab[data-t="inbox"]'); if(t) t.textContent=TABS.inbox.label; }
function renderTabs(){
  $("#tabs").innerHTML=Object.entries(TABS).map(([k,t])=>`<button class="tab ${k===tab?"on":""}" data-t="${k}">${t.label}</button>`).join("");
  const p=$("#panel"); p.innerHTML=""; TABS[tab].render(p);
}
$("#tabs").onclick=e=>{ const b=e.target.closest(".tab"); if(!b) return; tab=b.dataset.t; renderTabs(); };

/* ---------- save ---------- */
function normalize(){
  C.videos.forEach(v=>{ v.youtubeId=ytId(v.youtubeUrl||v.youtubeId); v.platforms=[...(v.youtubeId||v.youtubeUrl?["youtube"]:[]),...(v.tiktokUrl?["tiktok"]:[])]; });
  C.quiz=C.quiz.filter(q=>q.q&&(q.a||[]).filter(Boolean).length>1).map(q=>({...q,a:q.a.filter(Boolean),correct:Math.min(Math.max(1,+q.correct||1),q.a.filter(Boolean).length)}));
  (C.site.ideas||[]).forEach(x=>{ if(!x.id) x.id="i"+Date.now().toString(36)+Math.random().toString(36).slice(2,5); });
}
async function saveAll(){
  const cats=(C.site.categories||[]).map(c=>c.name), miss=C.videos.findIndex(v=>!cats.includes(v.category));
  if(miss>=0){ tab="videos"; renderTabs(); const it=$("#panel").querySelectorAll(".item")[miss]; if(it){ it.classList.add("open"); const f=it.querySelector(".cats"); if(f){ f.parentElement.classList.add("need"); it.scrollIntoView({behavior:"smooth",block:"center"}); } }
    $("#status").innerHTML='<span class="bad">اختر مجال الفيديو قبل الحفظ</span>'; return; }
  const b=$("#saveBtn"); b.disabled=true; $("#status").textContent="جارٍ الحفظ…";
  try{
    normalize();
    await db.collection(DOC[0]).doc(DOC[1]).set({json:JSON.stringify(C),updated:firebase.firestore.FieldValue.serverTimestamp()});
    setDirty(false); $("#status").innerHTML='<span class="ok">✓ تم الحفظ — التغييرات ظاهرة الآن في الموقع</span>'; renderTabs();
  }catch(e){
    console.warn(e);
    $("#status").innerHTML=`<span class="bad">${e&&e.code==="permission-denied"?"ليس لديك صلاحية الحفظ — تأكد أن إيميلك مكتوب في قواعد Firestore (راجع الدليل)":"تعذّر الحفظ، تحقق من الاتصال وحاول مجددًا"}</span>`;
  }
  b.disabled=false;
}
$("#saveBtn").onclick=()=>saveAll();

/* ---------- auth + load ---------- */
async function start(user){
  $("#loginCard").classList.add("hide");
  $("#who").innerHTML=`<span class="av">${esc((user.displayName||user.email||"?").trim()[0].toUpperCase())}</span><button class="btn sm" id="outBtn">خروج</button>`;
  $("#outBtn").onclick=()=>auth.signOut().then(()=>location.reload());
  $("#status").textContent="جارٍ تحميل المحتوى…";
  const def=await loadDefaults();
  let saved=null;
  try{ const d=await db.collection(DOC[0]).doc(DOC[1]).get(); if(d.exists&&d.data().json) saved=JSON.parse(d.data().json); }
  catch(e){ console.warn(e); $("#status").innerHTML='<span class="bad">تعذّر تحميل المحتوى المحفوظ. حدّث الصفحة وحاول مرة أخرى.</span>'; $("#saveBar").classList.remove("hide"); $("#saveBtn").disabled=true; return; }
  C={site:{...def.site,...(saved&&saved.site||{})},videos:(saved&&saved.videos)||def.videos,quiz:(saved&&saved.quiz)||def.quiz};
  $("#app").classList.remove("hide"); $("#saveBar").classList.remove("hide");
  renderTabs(); setDirty(false); loadInbox();
  if(!saved) $("#status").innerHTML='<span class="bad">هذه القيم الافتراضية من الموقع — اضغط «حفظ ونشر» لتفعيل لوحة التحكم</span>';
}
try{
  firebase.initializeApp(FB); auth=firebase.auth(); db=firebase.firestore();
  auth.onAuthStateChanged(u=>{ if(u) start(u); });
  auth.getRedirectResult().catch(e=>$("#loginErr").textContent="تعذّر تسجيل الدخول: "+(e.message||e));
  $("#loginBtn").onclick=async()=>{
    $("#loginErr").textContent="";
    const pr=new firebase.auth.GoogleAuthProvider();
    try{ await auth.signInWithPopup(pr); }
    catch(e){ if(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment") return auth.signInWithRedirect(pr);
      $("#loginErr").textContent = e.code==="auth/unauthorized-domain" ? "هذا النطاق غير مضاف في Firebase → Authentication → Settings → Authorized domains" :
        e.code==="auth/operation-not-allowed" ? "فعّل تسجيل الدخول بـ Google في Firebase → Authentication → Sign-in method" : "تعذّر تسجيل الدخول: "+(e.message||e.code); }
  };
}catch(e){ $("#loginErr").textContent="تعذّر تحميل Firebase — افتح الصفحة من الموقع المنشور وتأكد من الاتصال بالإنترنت."; }
</script>
